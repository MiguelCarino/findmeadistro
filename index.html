<body>
  <header>
    <h1 id="BigTitle">Find Me a Distro</h1>
    <p>Discover a new distribution with a single click</p>
    <button id="dmbutton" onclick="dmchange()" title="Toggle Theme">
      <img src="img/thememode.png" id="dmimg" alt="Toggle Theme">
    </button>
  </header>

  <main>
    <section class="action">
      <button id="random-button" onclick="clicked()">Find Me a Distro</button>
    </section>

    <section class="families">
      <h2>Distro Families</h2>
      <div class="family-buttons">
        <button class="family-button" id="FMALDALL" onclick="toggleDistro(1)"><img src="img/distromoe-inverted.png" alt=""><span>All</span></button>
        <button class="family-button" id="FMALDDEBIAN" onclick="toggleDistro(2)"><img src="img/debian.ico" alt=""><span>Debian</span></button>
        <button class="family-button" id="FMALDARCH" onclick="toggleDistro(3)"><img src="img/arch.png" alt=""><span>Arch</span></button>
        <button class="family-button" id="FMALDFEDORA" onclick="toggleDistro(5)"><img src="img/fedora.ico" alt=""><span>Fedora</span></button>
        <button class="family-button" id="FMALDSUSE" onclick="toggleDistro(6)"><img src="img/opensuse.png" alt=""><span>SUSE</span></button>
        <button class="family-button" id="FMALDGENTOO" onclick="toggleDistro(4)"><img src="img/gentoo.ico" alt=""><span>Gentoo</span></button>
        <button class="family-button" id="FMALDSLACK" onclick="toggleDistro(7)"><img src="img/slackware.png" alt=""><span>Slack</span></button>
        <button class="family-button" id="FMALDBSD" onclick="toggleDistro(8)"><img src="img/freebsd.ico" alt=""><span>BSD</span></button>
        <button class="family-button" id="FMALDOTHER" onclick="toggleDistro(9)"><img src="img/void.png" alt=""><span>Other</span></button>
      </div>
    </section>

    <section class="eol">
      <h2>EOL Options</h2>
      <div class="eol-buttons">
        <button id="EOLoff" onclick="toggleEOL(2)">EOL Off</button>
        <button id="EOLon" onclick="toggleEOL(1)">EOL On</button>
        <button id="EOLonly" onclick="toggleEOL(3)">EOL Only</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-icons">
      <button onclick="relocateGithubHome()"><img src="img/GitHub_logo.png" alt="GitHub" /></button>
      <button onclick="relocateGithub()">Suggestions?</button>
